[package]
name = "codex-chat-transfer"
version = "0.3.1"
edition = "2021"
license = "MIT"
default-run = "codex-chat-transfer"

[[bin]]
name = "codex-chat-transfer"
path = "src/main.rs"

[[bin]]
name = "codex-chat-transfer-cli"
path = "src/console.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
fs2 = "0.4"
include_dir = "0.7"
mime_guess = "2"
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
